# ------------------------------------------------------------------
# Bu dosyayi kopyalayin -> ayarlar.yaml olarak kaydedin ve doldurun.
# ayarlar.yaml .gitignore'dadir; API anahtarlariniz GitHub'a gitmez.
# Hic anahtar girmeseniz de sistem calisir (ambient ses + Pollinations gorsel).
# ------------------------------------------------------------------

# --- Sahne / gorsel uretimi (asmr.py sifirdan uretim icin) ---
sahne:
  # "pollinations" : bedava, anahtarsiz AI gorsel (sabit)  [varsayilan]
  # "yerel_sd"     : yerel Stable Diffusion (diffusers, GPU onerilir, sabit)
  # "pexels_foto"  : Pexels stok FOTOGRAFI (sabit, gercek foto)
  # "pexels_video" : Pexels stok VIDEOSU (HAREKETLI arka plan)
  motor: "pollinations"
  cozunurluk: "1280x720"
  stil: "cinematic, soft calming atmosphere, dreamy, high quality, highly detailed, no text, relaxing mood"
  # --- yalnizca motor: "pexels_foto" / "pexels_video" icin ---
  # Ucretsiz anahtar: https://www.pexels.com/api/  (PEXELS_API_KEY ortam
  # degiskeni de kullanilabilir; GitHub Actions'ta secret olarak ekleyin).
  # Pexels basarisiz olursa/anahtar yoksa otomatik Pollinations'a duser.
  pexels_api_key: ""
  # --- yalnizca motor: "yerel_sd" icin ---
  sd_model: "stabilityai/stable-diffusion-xl-base-1.0"  # HF model kimligi
  adim: 30                     # cikarim adimi (yuksek = kaliteli/yavas)
  yonlendirme: 7.5             # guidance_scale (prompt'a baglilik)
  negatif_prompt: "text, watermark, signature, blurry, lowres, deformed"
  # seed: 42                   # (opsiyonel) tekrarlanabilir sonuc icin

# --- Ortak montaj (cozunurluk / fps) ---
montaj:
  cozunurluk: [1280, 720]
  fps: 24

# --- ASMR (uzun rahatlama/uyku videosu; python asmr.py) ---
# Telifsiz, kodla uretilen ambient ses ortami (yagmur/okyanus/somine/gece/
# ruzgar/gurultu) + sakinlestirici gorseller uzerinde yavas Ken Burns akis.
# Ses ve gorsel tamamen bedava/anahtarsiz uretilir.
asmr:
  tip: "yagmur"               # ambient ses tipi: yagmur | okyanus | somine | ates | gece | ruzgar | beyaz | pembe | kahve
  gorsel_sayisi: 4            # kac farkli gorsel uretilsin (dongude sirayla akar)
  sahne_sn: 40               # her gorsel ~kac sn ekranda kalir (buyuk -> daha sakin)
  gecis_sn: 2.0              # gorseller arasi yumusak crossfade suresi (sn)
  fps: 12                    # dusuk fps -> cok daha hizli render (yavas akista fark yok)
  hareket: "yavas"           # "yavas" (Ken Burns zoom) | "sabit" (hareketsiz, en hizli render)
  loop_sure: 120             # ambient ses loop uzunlugu (sn); dosyaya tekrar yazilir
  ambient_seviye: 0.85       # ambient ses seviyesi (anlatim varken kismen dususe uygun 0-1)
  # --- opsiyonel yumusak anlatim (edge-tts) ---
  anlatim_ses: "tr-TR-EmelNeural"   # anlatim sesi (erkek: tr-TR-AhmetNeural)
  anlatim_hiz: "-12%"        # cok yavas, sakin tempo
  anlatim_pitch: "+0Hz"
  anlatim_seviye: 1.0        # anlatim ses seviyesi (0-1)
  anlatim_baslangic: 3.0     # anlatim, videonun kacinci sn'sinde baslasin
  kanal_adi: "ASMR"

# --- Klip birlestirme (kullanici kliplerinden uzun ASMR; python birlestir.py) ---
# Repoya (klipler/ klasoru) yuklenen gunluk video klipleri yumusak gecisle
# birlestirilir ve hedef sureye DONGULENIR. Kaynak uretmez; hazir klipleri isler.
klip:
  sure: 1800                  # hedef sure (sn): 1800 = 30 dk, 3600 = 60 dk
  gecis_sn: 0.8              # klipler arasi yumusak crossfade suresi (sn); 0 = sert kesim
  fps: 24                    # cikti kare/sn
  ses: "koru"                # "koru" (klip sesi) | "ambient_ekle" (altina ambient) | "ambient_degistir"
  ambient_tip: "yagmur"      # ses ambient_* ise: yagmur | okyanus | somine | gece | ruzgar | beyaz
  loop_sure: 120             # ambient loop uzunlugu (sn)

# --- YouTube'a yukleme (opsiyonel) ---
yukleme:
  aktif: false                 # true yapinca YouTube'a yukler
  gizlilik: "private"          # private | unlisted | public
  kategori_id: "22"            # 22 = People & Blogs (ASMR icin uygun); 24 = Entertainment
  cocuk_icin: false            # ASMR icin false (true olursa yorumlar kapanir, cocuk icerigi)
  client_secret: "config/client_secret.json"   # Google Cloud'dan indireceginiz dosya
