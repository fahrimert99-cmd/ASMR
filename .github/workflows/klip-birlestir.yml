name: Klip Birlestir - ASMR

# Kullanicinin klipler/ altina yukledigi kliplerden uzun ASMR videosu birlestirir
# (birlestir.py). klipler/** altina video push edilince otomatik; elle de calisir.
# Cikti: ilgili calismanin Artifacts bolumunde "birlesik-asmr-video".
# YouTube sirlari tanimliysa otomatik yuklenir.

on:
  push:
    paths:
      - "klipler/**"
  workflow_dispatch:
    inputs:
      sure:
        description: "Hedef sure (saniye; 1800 = 30 dk, 3600 = 60 dk)"
        type: string
        default: "1800"
      gizlilik:
        description: "YouTube gizliligi (yalnizca yukleme aktifse)"
        type: choice
        options: [private, unlisted, public]
        default: private

concurrency:
  group: klip-birlestir
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  birlestir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Klipleri birlestir
        run: |
          python birlestir.py --sure "${{ github.event.inputs.sure || '1800' }}"

      - name: Uretilen videoyu bul
        id: video
        run: |
          yol="$(find cikti -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$yol" ]; then
            echo "::error::Video uretilemedi (cikti altinda .mp4 yok)."
            exit 1
          fi
          echo "Bulunan video: $yol"
          echo "yol=$yol" >> "$GITHUB_OUTPUT"

      - name: Videoyu Artifacts'e yukle
        uses: actions/upload-artifact@v4
        with:
          name: birlesik-asmr-video
          path: ${{ steps.video.outputs.yol }}
          if-no-files-found: error
          retention-days: 7

      - name: YouTube'a yukle (sir tanimliysa)
        if: env.YOUTUBE_TOKEN_JSON != ''
        run: |
          python scripts/youtube_yukle.py \
            --video "${{ steps.video.outputs.yol }}" \
            --baslik "ASMR - Rahatlama ve Uyku" \
            --aciklama "Rahatlatici ASMR videosu. Uyku, dinlenme ve odaklanma icin. #asmr #rahatlama #uyku #relax" \
            --etiketler "asmr,rahatlama,uyku,relax,ambient" \
            --gizlilik "${{ github.event.inputs.gizlilik || 'private' }}"
