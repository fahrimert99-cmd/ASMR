name: Klip Birlestir - ASMR

# Kullanicinin klipler/ altina push ettigi videolari birlestirip hedef sureye
# dongulenmis uzun ASMR videosu uretir (birlestir.py). Klip sesleri korunur.
# - klipler/ altina video push edilince otomatik
# - Elle (workflow_dispatch): sure / gizlilik secilebilir
# Cikti: Artifacts bolumunde "birlesik-asmr-video".

on:
  push:
    paths:
      - "klipler/**.mp4"
      - "klipler/**.mov"
      - "klipler/**.webm"
      - "klipler/**.mkv"
      - "klipler/**.m4v"
      - "klipler/**.avi"
  workflow_dispatch:
    inputs:
      sure:
        description: "Hedef sure (saniye; 1800=30dk, 3600=60dk)"
        default: "1800"
      gizlilik:
        description: "YouTube gizlilik (yuklenirse)"
        default: "public"

concurrency:
  group: klip-birlestir-${{ github.ref }}
  cancel-in-progress: false

jobs:
  birlestir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Klipleri birlestir
        run: |
          python birlestir.py \
            --sure "${{ github.event.inputs.sure || '1800' }}"

      - name: Uretilen videoyu bul
        id: video
        run: |
          yol="$(find cikti -type f -name '*.mp4' | head -n1)"
          echo "yol=$yol" >> "$GITHUB_OUTPUT"
          echo "Bulunan video: ${yol:-<yok>}"

      - name: Videoyu Artifact olarak yukle
        if: ${{ steps.video.outputs.yol != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: birlesik-asmr-video
          path: cikti/**/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: YouTube'a yukle (opsiyonel; secret varsa)
        if: ${{ steps.video.outputs.yol != '' && env.YOUTUBE_TOKEN_JSON != '' }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          python scripts/youtube_yukle.py \
            --video "${{ steps.video.outputs.yol }}" \
            --baslik "ASMR | Rahatlama & Uyku" \
            --aciklama "Kliplerden birlestirilmis uzun ASMR — rahatlama ve uyku icin. #asmr #rahatlama #uyku #relaxing #sleep" \
            --etiketler "asmr,rahatlama,uyku,relaxing,sleep,meditation" \
            --gizlilik "${{ github.event.inputs.gizlilik || 'public' }}"
