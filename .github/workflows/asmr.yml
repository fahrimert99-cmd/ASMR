name: ASMR

# Sifirdan otonom ASMR videosu uretir (asmr.py).
# - Her gun ~21:00 TR (18:00 UTC) otomatik calisir.
# - Elle de calistirilabilir (workflow_dispatch): tema / sure / gorsel / anlatim secilir.
# Cikti: ilgili calismanin Artifacts bolumunde "asmr-video".
# YouTube sirlari (YOUTUBE_TOKEN_JSON, YOUTUBE_OAUTH_JSON) tanimliysa otomatik yuklenir.

on:
  schedule:
    - cron: "0 18 * * *"          # 21:00 TR (UTC+3) = 18:00 UTC
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (yagmur|okyanus|somine|gece|ruzgar|beyaz|pembe|kahve veya serbest tarif)"
        type: string
        default: "yagmur"
      sure:
        description: "Hedef sure (saniye; 1800 = 30 dk, 3600 = 60 dk)"
        type: string
        default: "1800"
      gorsel_sayisi:
        description: "Kac farkli gorsel uretilsin"
        type: string
        default: "4"
      anlatim:
        description: "Opsiyonel yumusak anlatim metni (bos ise sadece ambient)"
        type: string
        default: ""
      gizlilik:
        description: "YouTube gizliligi (yalnizca yukleme aktifse)"
        type: choice
        options: [private, unlisted, public]
        default: private

# Ayni anda tek calisma yeter; yeni tetikleme oncekini iptal etmesin.
concurrency:
  group: asmr-uret
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ASMR videosu uret
        run: |
          python asmr.py \
            --tema "${{ github.event.inputs.tema || 'yagmur' }}" \
            --sure "${{ github.event.inputs.sure || '1800' }}" \
            --gorsel-sayisi "${{ github.event.inputs.gorsel_sayisi || '4' }}" \
            --anlatim "${{ github.event.inputs.anlatim || '' }}"

      - name: Uretilen videoyu bul
        id: video
        run: |
          yol="$(find cikti -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$yol" ]; then
            echo "::error::Video uretilemedi (cikti altinda .mp4 yok)."
            exit 1
          fi
          echo "Bulunan video: $yol"
          echo "yol=$yol" >> "$GITHUB_OUTPUT"

      - name: Videoyu Artifacts'e yukle
        uses: actions/upload-artifact@v4
        with:
          name: asmr-video
          path: ${{ steps.video.outputs.yol }}
          if-no-files-found: error
          retention-days: 7

      - name: YouTube'a yukle (sir tanimliysa)
        if: env.YOUTUBE_TOKEN_JSON != ''
        run: |
          tema="${{ github.event.inputs.tema || 'yagmur' }}"
          python scripts/youtube_yukle.py \
            --video "${{ steps.video.outputs.yol }}" \
            --baslik "$tema ASMR - Rahatlama ve Uyku" \
            --aciklama "Rahatlatici $tema ASMR ortami. Uyku, dinlenme ve odaklanma icin. #asmr #rahatlama #uyku #relax" \
            --etiketler "asmr,rahatlama,uyku,relax,ambient,$tema" \
            --gizlilik "${{ github.event.inputs.gizlilik || 'private' }}"
